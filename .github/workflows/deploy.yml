name: Deploy Quartz site to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Cache Quartz engine dependencies
        uses: actions/cache@v5
        with:
          path: .quartz-engine/node_modules
          key: ${{ runner.os }}-quartz-${{ hashFiles('.quartz-engine/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-quartz-
      - name: Cache Quartz plugins
        uses: actions/cache@v5
        with:
          path: .quartz-engine/.quartz/plugins
          key: ${{ runner.os }}-plugins-${{ hashFiles('.quartz-engine/package-lock.json', 'quartz.config.yaml') }}
          restore-keys: |
            ${{ runner.os }}-plugins-
      - name: Link content and install engine deps
        run: node scripts/setup-engine.mjs
      - name: Build site
        run: node scripts/run-quartz.mjs build
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .quartz-engine/public

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
